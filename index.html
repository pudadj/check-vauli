<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roblox Game Valuation Wiki</title>
<style>
  :root{
    --bg:#0d1117;
    --bg-panel:#151b23;
    --bg-card:#1a2029;
    --border:#2a3341;
    --text:#e6edf3;
    --text-dim:#8b949e;
    --accent:#ff004d;
    --accent2:#ffb703;
    --green:#3fb950;
    --blue:#58a6ff;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
  }
  header{
    padding:22px 24px 16px;
    border-bottom:1px solid var(--border);
    background:linear-gradient(180deg,#161c26,#0d1117);
    position:sticky;top:0;z-index:20;
  }
  header h1{
    margin:0 0 4px;
    font-size:22px;
    letter-spacing:.3px;
  }
  header h1 span{color:var(--accent);}
  header p{margin:0;color:var(--text-dim);font-size:13px;}

  .toolbar{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:14px;
  }
  .toolbar input[type="text"]{
    flex:1;
    min-width:180px;
    padding:9px 12px;
    background:var(--bg-card);
    border:1px solid var(--border);
    border-radius:8px;
    color:var(--text);
    font-size:14px;
  }
  .toolbar select{
    padding:9px 10px;
    background:var(--bg-card);
    border:1px solid var(--border);
    border-radius:8px;
    color:var(--text);
    font-size:14px;
  }
  .toolbar button{
    padding:9px 14px;
    background:var(--accent);
    border:none;
    border-radius:8px;
    color:#fff;
    font-weight:600;
    font-size:13px;
    cursor:pointer;
  }
  .toolbar button.secondary{
    background:var(--bg-card);
    border:1px solid var(--border);
    color:var(--text);
  }

  main{
    max-width:1200px;
    margin:0 auto;
    padding:22px 24px 60px;
  }

  #status{color:var(--text-dim);font-size:13px;margin-bottom:14px;}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:16px;
  }

  .card{
    background:var(--bg-card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px;
    cursor:pointer;
    transition:transform .12s ease, border-color .12s ease;
  }
  .card:hover{
    transform:translateY(-2px);
    border-color:var(--accent);
  }
  .card h3{
    margin:0 0 8px;
    font-size:16px;
  }
  .card .score-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
  }
  .score-badge{
    font-weight:700;
    font-size:15px;
    padding:3px 9px;
    border-radius:20px;
    background:rgba(63,185,80,.15);
    color:var(--green);
  }
  .score-badge.mid{background:rgba(255,183,3,.15);color:var(--accent2);}
  .score-badge.low{background:rgba(255,0,77,.15);color:var(--accent);}

  .card .robux{
    font-size:13px;
    color:var(--text-dim);
    margin-bottom:10px;
  }
  .card .robux b{color:var(--text);}

  .barmini{
    height:6px;
    background:#0d1117;
    border-radius:4px;
    overflow:hidden;
    border:1px solid var(--border);
  }
  .barmini i{
    display:block;height:100%;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
  }

  .card .meta{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    color:var(--text-dim);
    margin-top:10px;
  }

  /* Modal / detail panel */
  .overlay{
    position:fixed;inset:0;
    background:rgba(0,0,0,.6);
    display:none;
    align-items:flex-start;
    justify-content:center;
    padding:30px 16px;
    overflow-y:auto;
    z-index:100;
  }
  .overlay.open{display:flex;}
  .detail{
    background:var(--bg-panel);
    border:1px solid var(--border);
    border-radius:14px;
    max-width:820px;
    width:100%;
    padding:26px;
    position:relative;
  }
  .detail .close{
    position:absolute;top:14px;right:16px;
    background:none;border:none;color:var(--text-dim);
    font-size:22px;cursor:pointer;line-height:1;
  }
  .detail h2{margin:0 0 4px;font-size:24px;}
  .detail .valuation-box{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:linear-gradient(135deg,rgba(255,0,77,.12),rgba(255,183,3,.08));
    border:1px solid var(--border);
    border-radius:10px;
    padding:16px 18px;
    margin:16px 0 20px;
    flex-wrap:wrap;
    gap:10px;
  }
  .valuation-box .label{color:var(--text-dim);font-size:12px;text-transform:uppercase;letter-spacing:.6px;}
  .valuation-box .value{font-size:22px;font-weight:700;color:var(--accent2);}
  .valuation-box .score{font-size:32px;font-weight:800;}

  .crit-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px 18px;
  }
  @media(max-width:600px){.crit-grid{grid-template-columns:1fr;}}

  .crit-item{
    border-bottom:1px solid var(--border);
    padding:9px 0;
  }
  .crit-item .top{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    margin-bottom:5px;
  }
  .crit-item .top .name{color:var(--text);font-weight:600;}
  .crit-item .top .val{color:var(--blue);font-weight:700;}
  .crit-item .bar{
    height:6px;background:#0d1117;border-radius:4px;overflow:hidden;border:1px solid var(--border);
    margin-bottom:5px;
  }
  .crit-item .bar i{display:block;height:100%;background:var(--blue);}

  .section-label{
    margin:22px 0 10px;
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:.7px;
    color:var(--text-dim);
    border-left:3px solid var(--accent);
    padding-left:8px;
  }

  footer{
    text-align:center;
    color:var(--text-dim);
    font-size:12px;
    padding:30px 10px 40px;
  }
  a{color:var(--blue);}
</style>
</head>
<body>

<header>
  <h1>Roblox Game <span>Valuation</span> Wiki</h1>
  <p>Định giá game Roblox theo nhiều tiêu chí — dữ liệu nạp từ <code>content.json</code></p>
  <div class="toolbar">
    <input type="text" id="search" placeholder="Tìm game theo tên...">
    <select id="sortSel">
      <option value="score_desc">Điểm cao → thấp</option>
      <option value="score_asc">Điểm thấp → cao</option>
      <option value="robux_desc">Robux (max) cao → thấp</option>
      <option value="robux_asc">Robux (max) thấp → cao</option>
      <option value="name_asc">Tên A → Z</option>
      <option value="ccu_desc">CCU hiện tại cao → thấp</option>
    </select>
    <button class="secondary" id="reloadBtn">Tải lại content.json</button>
  </div>
</header>

<main>
  <div id="status">Đang tải dữ liệu...</div>
  <div class="grid" id="grid"></div>
</main>

<footer>
  Đặt file <code>content.json</code> (mảng các object <code>{ "game": {...} }</code>) cùng thư mục với <code>index.html</code> rồi host bằng GitHub Pages.
</footer>

<div class="overlay" id="overlay">
  <div class="detail" id="detailBox"></div>
</div>

<script>
const DATA_URL = 'content.json';
let allGames = [];

const grid = document.getElementById('grid');
const statusEl = document.getElementById('status');
const searchEl = document.getElementById('search');
const sortEl = document.getElementById('sortSel');
const overlay = document.getElementById('overlay');
const detailBox = document.getElementById('detailBox');

function fmtNum(n){
  if (n === undefined || n === null || isNaN(n)) return '-';
  n = Number(n);
  const abs = Math.abs(n);
  if (abs >= 1e9) return (n/1e9).toFixed(2).replace(/\.00$/,'') + 'B';
  if (abs >= 1e6) return (n/1e6).toFixed(2).replace(/\.00$/,'') + 'M';
  if (abs >= 1e3) return (n/1e3).toFixed(1).replace(/\.0$/,'') + 'K';
  return n.toLocaleString('vi-VN');
}

function scoreClass(v){
  if (v >= 66) return '';
  if (v >= 40) return 'mid';
  return 'low';
}

function humanLabel(key){
  return key.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase());
}

async function loadData(){
  statusEl.textContent = 'Đang tải dữ liệu...';
  try{
    const res = await fetch(DATA_URL + '?t=' + Date.now());
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    allGames = Array.isArray(json) ? json.map(g => g.game || g) : [json.game || json];
    statusEl.textContent = `Đã tải ${allGames.length} game.`;
    render();
  }catch(err){
    statusEl.textContent = 'Lỗi tải content.json: ' + err.message + ' (nếu mở trực tiếp file:// hãy chạy qua local server hoặc GitHub Pages).';
    grid.innerHTML = '';
  }
}

function getFiltered(){
  const q = searchEl.value.trim().toLowerCase();
  let list = allGames.filter(g => !q || (g.name || '').toLowerCase().includes(q));

  const sortMode = sortEl.value;
  list = list.slice().sort((a,b) => {
    const sa = (a.overall_score && a.overall_score.value) || 0;
    const sb = (b.overall_score && b.overall_score.value) || 0;
    const ra = (a.robux_valuation && a.robux_valuation.max) || 0;
    const rb = (b.robux_valuation && b.robux_valuation.max) || 0;
    const ca = (a.criteria && a.criteria.ccu_current && a.criteria.ccu_current.value) || 0;
    const cb = (b.criteria && b.criteria.ccu_current && b.criteria.ccu_current.value) || 0;
    switch(sortMode){
      case 'score_desc': return sb - sa;
      case 'score_asc': return sa - sb;
      case 'robux_desc': return rb - ra;
      case 'robux_asc': return ra - rb;
      case 'ccu_desc': return cb - ca;
      case 'name_asc': return (a.name||'').localeCompare(b.name||'');
      default: return 0;
    }
  });
  return list;
}

function render(){
  const list = getFiltered();
  grid.innerHTML = '';
  if(list.length === 0){
    grid.innerHTML = '<p style="color:var(--text-dim)">Không tìm thấy game phù hợp.</p>';
    return;
  }
  list.forEach((g, idx) => {
    const score = (g.overall_score && g.overall_score.value) || 0;
    const ccu = g.criteria && g.criteria.ccu_current ? g.criteria.ccu_current.value : 0;
    const like = g.criteria && g.criteria.like_ratio ? g.criteria.like_ratio.value : null;
    const rv = g.robux_valuation || {};

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <h3>${g.name || 'Không tên'}</h3>
      <div class="score-row">
        <span class="score-badge ${scoreClass(score)}">${score.toFixed(1)} điểm</span>
        ${like !== null ? `<span style="font-size:12px;color:var(--text-dim)">👍 ${like}%</span>` : ''}
      </div>
      <div class="barmini"><i style="width:${Math.min(score,100)}%"></i></div>
      <div class="robux">Định giá: <b>${fmtNum(rv.min)} – ${fmtNum(rv.max)}</b> Robux</div>
      <div class="meta">
        <span>CCU: ${fmtNum(ccu)}</span>
        <span>Xem chi tiết →</span>
      </div>
    `;
    card.addEventListener('click', () => openDetail(g));
    grid.appendChild(card);
  });
}

function openDetail(g){
  const rv = g.robux_valuation || {};
  const score = (g.overall_score && g.overall_score.value) || 0;
  const criteria = g.criteria || {};

  let critHtml = '';
  Object.keys(criteria).forEach(key => {
    const item = criteria[key];
    const val = item.value;
    const isPercentLike = ['ccu_growth_rate','like_ratio'].includes(key);
    const barPct = isPercentLike ? Math.min(Math.abs(val),100) : (key.startsWith('ccu') ? Math.min((val/1000)*10,100) : Math.min(val,100));
    critHtml += `
      <div class="crit-item">
        <div class="top">
          <span class="name">${humanLabel(key)}</span>
          <span class="val">${typeof val === 'number' ? (Number.isInteger(val) ? val.toLocaleString('vi-VN') : val) : val}${isPercentLike ? '%' : ''}</span>
        </div>
        <div class="bar"><i style="width:${barPct}%"></i></div>
      </div>
    `;
  });

  detailBox.innerHTML = `
    <button class="close" id="closeBtn">&times;</button>
    <h2>${g.name || 'Không tên'}</h2>
    <div class="valuation-box">
      <div>
        <div class="label">Định giá Robux</div>
        <div class="value">${fmtNum(rv.min)} – ${fmtNum(rv.max)} ${rv.currency || 'Robux'}</div>
      </div>
      <div>
        <div class="label" style="text-align:right">Điểm tổng hợp</div>
        <div class="score" style="color:${score>=66?'var(--green)':score>=40?'var(--accent2)':'var(--accent)'}">${score.toFixed(1)}<span style="font-size:14px;color:var(--text-dim)">/100</span></div>
      </div>
    </div>
    <div class="section-label">Chi tiết tiêu chí đánh giá</div>
    <div class="crit-grid">${critHtml}</div>
  `;
  overlay.classList.add('open');
  document.getElementById('closeBtn').addEventListener('click', closeDetail);
}

function closeDetail(){
  overlay.classList.remove('open');
}
overlay.addEventListener('click', (e) => { if(e.target === overlay) closeDetail(); });
document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeDetail(); });

searchEl.addEventListener('input', render);
sortEl.addEventListener('change', render);
document.getElementById('reloadBtn').addEventListener('click', loadData);

loadData();
</script>

</body>
</html>
